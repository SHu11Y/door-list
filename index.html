<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>DOOR LIST</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

:root {
  --bg:       #080808;
  --surf:     #141414;
  --surf2:    #1e1e1e;
  --border:   #2a2a2a;
  --gold:     #D4A017;
  --gold-dim: #8a6808;
  --green:    #22c55e;
  --green-bg: #0d1f0f;
  --green-bd: #166534;
  --red:      #ef4444;
  --red-bg:   #1f0d0d;
  --red-bd:   #7f1d1d;
  --text:     #f0f0f0;
  --muted:    #666;
  --font:     'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}

.screen { display: none; min-height: 100vh; }
.screen.active { display: flex; flex-direction: column; }

/* ─── PASSWORD ──────────────────────────────────── */
#pw {
  align-items: center;
  justify-content: center;
  padding: 2rem;
  background: radial-gradient(ellipse at center, #111 0%, #080808 70%);
}

.pw-eyebrow {
  font-size: 0.65rem;
  letter-spacing: 0.5em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 2.5rem;
}

.pw-title {
  font-size: clamp(2.5rem, 10vw, 4rem);
  font-weight: 900;
  letter-spacing: 0.08em;
  color: var(--gold);
  text-transform: uppercase;
  text-align: center;
  line-height: 1;
}

.pw-rule {
  width: 48px;
  height: 1px;
  background: var(--gold-dim);
  margin: 1.25rem auto 1rem;
}

.pw-sub {
  font-size: 0.7rem;
  letter-spacing: 0.35em;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 3rem;
  text-align: center;
}

.pw-form {
  width: 100%;
  max-width: 300px;
  display: flex;
  flex-direction: column;
  gap: 0.875rem;
}

.pw-input {
  background: #0e0e0e;
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 1.4rem;
  letter-spacing: 0.25em;
  padding: 1rem 1.25rem;
  text-align: center;
  outline: none;
  transition: border-color 0.2s;
  border-radius: 2px;
  width: 100%;
}
.pw-input:focus { border-color: var(--gold); }
.pw-input.shake {
  border-color: var(--red);
  animation: shake 0.3s ease;
}
@keyframes shake {
  0%,100% { transform: translateX(0); }
  20%      { transform: translateX(-10px); }
  60%      { transform: translateX(10px); }
}

.pw-error {
  color: var(--red);
  font-size: 0.7rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  text-align: center;
  height: 0.9rem;
}

/* ─── BUTTONS ──────────────────────────────────── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.35rem;
  font-family: var(--font);
  font-weight: 700;
  font-size: 0.8rem;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.875rem 1.5rem;
  border: none;
  cursor: pointer;
  transition: opacity 0.15s, transform 0.1s;
  border-radius: 2px;
  min-height: 48px;
  touch-action: manipulation;
  white-space: nowrap;
}
.btn:active { opacity: 0.8; transform: scale(0.98); }

.btn-gold  { background: var(--gold); color: #000; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.btn-ghost:hover { border-color: var(--muted); color: var(--text); }
.btn-full  { width: 100%; }
.btn-sm    { font-size: 0.7rem; padding: 0.6rem 1rem; min-height: 40px; }

/* ─── SETUP ─────────────────────────────────────── */
#setup {
  padding: 1.75rem 1.25rem 4rem;
  max-width: 560px;
  margin: 0 auto;
  width: 100%;
}

.setup-hd { margin-bottom: 2rem; }
.setup-hd h1 { font-size: 1.4rem; font-weight: 700; color: var(--gold); }
.setup-hd p  { color: var(--muted); font-size: 0.8rem; margin-top: 0.2rem; }

.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.875rem; }

.fld { margin-bottom: 1.1rem; }
.fld label {
  display: block;
  font-size: 0.6rem;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  margin-bottom: 0.4rem;
}
.fld input, .fld textarea {
  width: 100%;
  background: var(--surf);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.95rem;
  padding: 0.8rem 0.9rem;
  outline: none;
  border-radius: 2px;
  transition: border-color 0.2s;
}
.fld input:focus, .fld textarea:focus { border-color: var(--gold); }
.fld textarea { resize: vertical; min-height: 220px; line-height: 1.65; font-size: 0.875rem; }
.fld .hint { font-size: 0.7rem; color: var(--muted); margin-top: 0.35rem; line-height: 1.45; }
.fld .hint strong { color: #aaa; }

/* ─── BOUNCER ────────────────────────────────────── */
#bouncer { flex-direction: column; }

.b-top {
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  padding: 0.75rem 1rem;
  position: sticky;
  top: 0;
  z-index: 100;
}

.b-hdr {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  margin-bottom: 0.6rem;
  gap: 0.5rem;
}

.ev-name {
  font-size: 1rem;
  font-weight: 700;
  color: var(--gold);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  flex: 1;
}
.ev-date { font-size: 0.7rem; color: var(--muted); flex-shrink: 0; }

/* Stats */
.stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 3px;
  margin-bottom: 0.6rem;
}
.stat {
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 2px;
  padding: 0.3rem 0.2rem;
  text-align: center;
}
.stat-n {
  display: block;
  font-size: 1.05rem;
  font-weight: 700;
  line-height: 1;
}
.stat-l {
  display: block;
  font-size: 0.5rem;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--muted);
  margin-top: 0.15rem;
}
.stat.s-in   .stat-n { color: var(--green); }
.stat.s-den  .stat-n { color: var(--red); }
.stat.s-nol  .stat-n { color: #a78bfa; }

/* Capacity banner */
.cap-warn {
  background: #1e1000;
  border: 1px solid var(--gold-dim);
  color: var(--gold);
  font-size: 0.7rem;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  text-align: center;
  padding: 0.35rem 0.5rem;
  border-radius: 2px;
  margin-bottom: 0.6rem;
  display: none;
  font-weight: 700;
}
.cap-warn.full {
  background: #1e0000;
  border-color: var(--red-bd);
  color: var(--red);
}

/* Search row */
.srch-row { display: flex; gap: 0.4rem; align-items: stretch; }

.srch-input {
  flex: 1;
  background: var(--surf2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 1rem;
  padding: 0.75rem 0.9rem;
  outline: none;
  border-radius: 2px;
  min-height: 48px;
  transition: border-color 0.2s;
}
.srch-input:focus { border-color: var(--gold); }

.nol-btn {
  background: #12082a;
  border: 1px solid #4c1d95;
  color: #a78bfa;
  font-family: var(--font);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.4rem 0.6rem;
  cursor: pointer;
  border-radius: 2px;
  min-height: 48px;
  touch-action: manipulation;
  text-align: center;
  line-height: 1.3;
  transition: background 0.15s;
  flex-shrink: 0;
}
.nol-btn:active { background: #1e0e40; }

/* Filter tabs */
.ftabs {
  display: flex;
  gap: 3px;
  margin-top: 0.5rem;
}
.ftab {
  background: var(--surf2);
  border: 1px solid var(--border);
  color: var(--muted);
  font-family: var(--font);
  font-size: 0.6rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.3rem 0.55rem;
  cursor: pointer;
  border-radius: 2px;
  transition: all 0.15s;
  touch-action: manipulation;
  flex: 1;
  text-align: center;
}
.ftab.on { background: var(--gold); border-color: var(--gold); color: #000; }

/* ─── GUEST LIST ─────────────────────────────────── */
.glist {
  padding: 0.75rem 1rem 7rem;
  display: flex;
  flex-direction: column;
  gap: 0.45rem;
  max-width: 600px;
  width: 100%;
  margin: 0 auto;
}

.empty {
  text-align: center;
  color: var(--muted);
  font-size: 0.85rem;
  letter-spacing: 0.05em;
  padding: 3.5rem 1rem;
}

/* Guest card */
.gc {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 4px;
  overflow: hidden;
  transition: border-color 0.2s, background 0.2s;
}
.gc.admitted { border-color: var(--green-bd); background: var(--green-bg); }
.gc.denied   { border-color: var(--red-bd);   background: var(--red-bg);   }
.gc.dna      { border-left: 3px solid var(--red-bd); }

.gc-main {
  display: flex;
  align-items: center;
  padding: 0.8rem 0.875rem;
  gap: 0.6rem;
  min-height: 66px;
}

.gc-info {
  flex: 1;
  min-width: 0;
  cursor: pointer;
  user-select: none;
}

.gc-name {
  font-size: 1rem;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  line-height: 1.3;
  transition: color 0.2s;
}
.gc.admitted .gc-name { color: var(--green); }
.gc.denied   .gc-name { color: var(--red); }

.gc-meta {
  display: flex;
  align-items: center;
  gap: 0.3rem;
  margin-top: 0.25rem;
  flex-wrap: wrap;
  min-height: 1.1rem;
}

.badge {
  display: inline-block;
  font-size: 0.55rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  padding: 0.12rem 0.35rem;
  border-radius: 2px;
  line-height: 1.4;
}
.b-dna  { background: #2a0606; color: #f87171; border: 1px solid var(--red-bd); }
.b-p1   { background: #052010; color: var(--green); border: 1px solid var(--green-bd); }
.b-note { background: #1a1000; color: var(--gold); border: 1px solid var(--gold-dim); max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: middle; }
.ts     { font-size: 0.6rem; color: var(--muted); }

/* Action buttons */
.gc-acts { display: flex; gap: 0.35rem; flex-shrink: 0; }

.abt {
  width: 44px;
  height: 44px;
  border-radius: 3px;
  border: none;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  touch-action: manipulation;
  transition: transform 0.1s, opacity 0.1s;
  font-family: var(--font);
  font-weight: 700;
}
.abt:active { transform: scale(0.9); opacity: 0.8; }

.abt-p1 {
  background: var(--surf2);
  color: var(--muted);
  border: 1px solid var(--border);
  font-size: 0.7rem;
  letter-spacing: 0.02em;
}
.abt-p1.on {
  background: #052010;
  color: var(--green);
  border-color: var(--green-bd);
}

.abt-in {
  background: #0a2016;
  color: var(--green);
  border: 1px solid var(--green-bd);
  font-size: 1.15rem;
}
.abt-in.on { background: var(--green-bd); }

.abt-den {
  background: #200a0a;
  color: var(--red);
  border: 1px solid var(--red-bd);
  font-size: 1.15rem;
}
.abt-den.on { background: var(--red-bd); }

/* Notes panel */
.gc-notes {
  border-top: 1px solid var(--border);
  padding: 0.5rem 0.875rem;
  display: none;
}
.gc.open .gc-notes { display: block; }

.gc-notes input {
  width: 100%;
  background: var(--surf2);
  border: 1px solid var(--border);
  color: var(--text);
  font-family: var(--font);
  font-size: 0.85rem;
  padding: 0.5rem 0.7rem;
  border-radius: 2px;
  outline: none;
  transition: border-color 0.2s;
}
.gc-notes input:focus { border-color: var(--gold); }

/* ─── BOTTOM BAR ─────────────────────────────────── */
.bbar-wrap {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  z-index: 200;
  display: flex;
  justify-content: center;
}
.bbar {
  width: 100%;
  max-width: 600px;
  background: var(--surf);
  border-top: 1px solid var(--border);
  padding: 0.75rem 1rem;
  display: flex;
  gap: 0.5rem;
}
</style>
</head>
<body>

<!-- ═══════════════ PASSWORD ═══════════════ -->
<div id="pw" class="screen active">
  <p class="pw-eyebrow">Staff Access Only</p>
  <h1 class="pw-title">DOOR<br>LIST</h1>
  <div class="pw-rule"></div>
  <p class="pw-sub">Authorized Personnel</p>
  <form class="pw-form" onsubmit="checkPw(event)">
    <input id="pw-in" type="password" class="pw-input" placeholder="••••••••"
           autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
    <p id="pw-err" class="pw-error"></p>
    <button type="submit" class="btn btn-gold btn-full">Enter</button>
  </form>
</div>

<!-- ═══════════════ SETUP ═══════════════ -->
<div id="setup" class="screen">
  <div class="setup-hd">
    <h1>Event Setup</h1>
    <p>Configure your event and paste the guest list</p>
  </div>

  <div class="row2">
    <div class="fld">
      <label for="ev-name">Party Name</label>
      <input id="ev-name" type="text" placeholder="Saturday Night">
    </div>
    <div class="fld">
      <label for="ev-date">Date</label>
      <input id="ev-date" type="date">
    </div>
  </div>

  <div class="fld">
    <label for="ev-cap">Max Headcount</label>
    <input id="ev-cap" type="number" placeholder="200" min="1" inputmode="numeric">
  </div>

  <div class="fld">
    <label for="ev-list">Guest List</label>
    <textarea id="ev-list" placeholder="John Doe&#10;Jane Smith X&#10;Mike Johnson | VIP&#10;Sarah Lee X | Check ID&#10;Alex Kim | +2 expected"></textarea>
    <p class="hint">One name per line. Append <strong>X</strong> to flag DO NOT ADMIT. Add <strong>| note</strong> for inline notes.</p>
  </div>

  <button class="btn btn-gold btn-full" onclick="loadList()">Load Guest List →</button>
</div>

<!-- ═══════════════ BOUNCER ═══════════════ -->
<div id="bouncer" class="screen">

  <div class="b-top">
    <div class="b-hdr">
      <span class="ev-name" id="d-name">Event</span>
      <span class="ev-date" id="d-date"></span>
    </div>

    <div id="cap-warn" class="cap-warn"></div>

    <div class="stats">
      <div class="stat">
        <span class="stat-n" id="s-tot">0</span>
        <span class="stat-l">Total</span>
      </div>
      <div class="stat s-in">
        <span class="stat-n" id="s-in">0</span>
        <span class="stat-l">In</span>
      </div>
      <div class="stat s-den">
        <span class="stat-n" id="s-den">0</span>
        <span class="stat-l">Denied</span>
      </div>
      <div class="stat">
        <span class="stat-n" id="s-pend">0</span>
        <span class="stat-l">Pending</span>
      </div>
      <div class="stat s-nol">
        <span class="stat-n" id="s-nol">0</span>
        <span class="stat-l">No-List</span>
      </div>
    </div>

    <div class="srch-row">
      <input id="srch" type="search" class="srch-input" placeholder="Search guests…"
             oninput="render()" autocomplete="off" autocorrect="off" autocapitalize="off">
      <button class="nol-btn" onclick="addNOL()">+ Not<br>on List</button>
    </div>

    <div class="ftabs">
      <button class="ftab on" onclick="setFilter('all',this)">All</button>
      <button class="ftab"    onclick="setFilter('pending',this)">Pending</button>
      <button class="ftab"    onclick="setFilter('admitted',this)">In</button>
      <button class="ftab"    onclick="setFilter('denied',this)">Denied</button>
      <button class="ftab"    onclick="setFilter('dna',this)">DNA</button>
    </div>
  </div>

  <div class="glist" id="glist"></div>

  <div class="bbar-wrap">
    <div class="bbar">
      <button class="btn btn-ghost btn-sm" onclick="goSetup()" style="flex:0 0 auto">← Edit</button>
      <button class="btn btn-gold btn-sm" onclick="exportCSV()" style="flex:1">Export CSV</button>
    </div>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════
//  CHANGE THIS BEFORE EACH EVENT
const PASSWORD = 'doorman2024';
// ════════════════════════════════════════════════════

let guests      = [];
let nolCount    = 0;
let maxCap      = 0;
let filter      = 'all';

// ── Screens ───────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0, 0);
}

// ── Password ──────────────────────────────────────
function checkPw(e) {
  e.preventDefault();
  const inp = document.getElementById('pw-in');
  const err = document.getElementById('pw-err');
  if (inp.value === PASSWORD) {
    show('setup');
    document.getElementById('ev-date').value = new Date().toISOString().split('T')[0];
  } else {
    inp.classList.add('shake');
    err.textContent = 'Access denied.';
    inp.value = '';
    setTimeout(() => inp.classList.remove('shake'), 400);
  }
}
document.getElementById('pw-in').addEventListener('input', () => {
  document.getElementById('pw-err').textContent = '';
});

// ── Parse list ────────────────────────────────────
function parseList(text) {
  return text.split('\n')
    .map(l => l.trim())
    .filter(Boolean)
    .map((line, i) => {
      const [namePart, ...noteParts] = line.split('|');
      const noteRaw = noteParts.join('|').trim();

      const words = namePart.trim().split(/\s+/);
      const lastWord = words[words.length - 1];
      const dna = lastWord.toUpperCase() === 'X';
      const name = dna ? words.slice(0, -1).join(' ') : words.join(' ');

      return { id: i, name: name || `Guest ${i + 1}`, note: noteRaw, dna,
               status: 'pending', plus1: false, ts: null };
    });
}

function loadList() {
  const raw = document.getElementById('ev-list').value.trim();
  if (!raw) { alert('Paste a guest list first.'); return; }

  guests   = parseList(raw);
  nolCount = 0;
  maxCap   = parseInt(document.getElementById('ev-cap').value) || 0;
  filter   = 'all';

  const name = document.getElementById('ev-name').value.trim() || 'Event';
  const dateVal = document.getElementById('ev-date').value;
  document.getElementById('d-name').textContent = name;

  if (dateVal) {
    const d = new Date(dateVal + 'T12:00:00');
    document.getElementById('d-date').textContent =
      d.toLocaleDateString('en-US', { weekday:'short', month:'short', day:'numeric' });
  }

  document.querySelectorAll('.ftab').forEach((t,i) => t.classList.toggle('on', i === 0));
  show('bouncer');
  render();
  updateStats();
}

function goSetup() {
  if (guests.length && !confirm('Return to setup? Session data is kept.')) return;
  show('setup');
}

// ── Headcount ─────────────────────────────────────
function headcount() {
  const admitted = guests.filter(g => g.status === 'admitted');
  return admitted.length + admitted.filter(g => g.plus1).length + nolCount;
}

// ── Stats ─────────────────────────────────────────
function updateStats() {
  const hc   = headcount();
  const den  = guests.filter(g => g.status === 'denied').length;
  const pend = guests.filter(g => g.status === 'pending').length;

  document.getElementById('s-tot').textContent  = guests.length;
  document.getElementById('s-in').textContent   = hc;
  document.getElementById('s-den').textContent  = den;
  document.getElementById('s-pend').textContent = pend;
  document.getElementById('s-nol').textContent  = nolCount;

  const warn = document.getElementById('cap-warn');
  if (maxCap > 0) {
    const left = maxCap - hc;
    if (hc >= maxCap) {
      warn.style.display = 'block';
      warn.className = 'cap-warn full';
      warn.textContent = `⛔ AT CAPACITY — ${hc} / ${maxCap}`;
    } else if (left <= 10) {
      warn.style.display = 'block';
      warn.className = 'cap-warn';
      warn.textContent = `⚠ NEAR CAPACITY — ${left} spot${left === 1 ? '' : 's'} left`;
    } else {
      warn.style.display = 'none';
    }
  } else {
    warn.style.display = 'none';
  }
}

// ── Actions ───────────────────────────────────────
function admit(id) {
  const g = guests.find(g => g.id === id);
  if (!g) return;
  if (g.status !== 'admitted' && maxCap > 0 && headcount() >= maxCap) {
    if (!confirm(`⛔ AT CAPACITY (${maxCap})\n\nAdmit anyway?`)) return;
  }
  if (g.status === 'admitted') {
    g.status = 'pending'; g.ts = null; g.plus1 = false;
  } else {
    g.status = 'admitted';
    g.ts = new Date().toLocaleTimeString('en-US', { hour:'2-digit', minute:'2-digit' });
  }
  render(); updateStats();
}

function deny(id) {
  const g = guests.find(g => g.id === id);
  if (!g) return;
  if (g.status === 'denied') {
    g.status = 'pending';
  } else {
    g.status = 'denied'; g.ts = null; g.plus1 = false;
  }
  render(); updateStats();
}

function toggleP1(id) {
  const g = guests.find(g => g.id === id);
  if (!g || g.status !== 'admitted') return;
  g.plus1 = !g.plus1;
  render(); updateStats();
}

function setNote(id, val) {
  const g = guests.find(g => g.id === id);
  if (g) g.note = val;
}

function toggleOpen(id) {
  const card = document.getElementById('gc-' + id);
  if (card) card.classList.toggle('open');
}

function addNOL() {
  if (maxCap > 0 && headcount() >= maxCap) {
    if (!confirm(`⛔ AT CAPACITY (${maxCap})\n\nAdd anyway?`)) return;
  }
  nolCount++;
  updateStats();
  const el = document.querySelector('.stat.s-nol');
  el.style.background = '#1e0e40';
  setTimeout(() => el.style.background = '', 300);
}

// ── Filter ────────────────────────────────────────
function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.ftab').forEach(t => t.classList.remove('on'));
  btn.classList.add('on');
  render();
}

// ── Render ────────────────────────────────────────
function esc(s) {
  return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function render() {
  const q = (document.getElementById('srch').value || '').toLowerCase().trim();
  const list = document.getElementById('glist');

  const visible = guests.filter(g => {
    const matchQ = !q || g.name.toLowerCase().includes(q) || g.note.toLowerCase().includes(q);
    const matchF =
      filter === 'all'      ? true :
      filter === 'pending'  ? g.status === 'pending' :
      filter === 'admitted' ? g.status === 'admitted' :
      filter === 'denied'   ? g.status === 'denied' :
      filter === 'dna'      ? g.dna : true;
    return matchQ && matchF;
  });

  if (!visible.length) {
    list.innerHTML = `<div class="empty">No guests found</div>`;
    return;
  }

  // Preserve open state
  const openSet = new Set(
    [...document.querySelectorAll('.gc.open')].map(el => parseInt(el.id.replace('gc-','')))
  );

  list.innerHTML = visible.map(g => {
    const isIn  = g.status === 'admitted';
    const isDen = g.status === 'denied';
    const isOpen = openSet.has(g.id);

    const dnaBadge  = g.dna ? `<span class="badge b-dna">Do Not Admit</span>` : '';
    const p1Badge   = g.plus1 && isIn ? `<span class="badge b-p1">+1</span>` : '';
    const noteBadge = g.note && !isOpen ? `<span class="badge b-note" title="${esc(g.note)}">${esc(g.note)}</span>` : '';
    const tsSpan    = g.ts ? `<span class="ts">${esc(g.ts)}</span>` : '';

    return `
<div class="gc${isIn?' admitted':''}${isDen?' denied':''}${g.dna?' dna':''}${isOpen?' open':''}" id="gc-${g.id}">
  <div class="gc-main">
    <div class="gc-info" onclick="toggleOpen(${g.id})">
      <div class="gc-name">${esc(g.name)}</div>
      <div class="gc-meta">${dnaBadge}${p1Badge}${noteBadge}${tsSpan}</div>
    </div>
    <div class="gc-acts">
      <button class="abt abt-p1${g.plus1?' on':''}" onclick="toggleP1(${g.id})" title="Toggle +1">+1</button>
      <button class="abt abt-in${isIn?' on':''}"   onclick="admit(${g.id})"    title="Admit">✓</button>
      <button class="abt abt-den${isDen?' on':''}" onclick="deny(${g.id})"     title="Deny">✕</button>
    </div>
  </div>
  <div class="gc-notes">
    <input type="text" placeholder="Note (VIP, check ID…)"
           value="${esc(g.note)}"
           oninput="setNote(${g.id}, this.value)"
           autocomplete="off">
  </div>
</div>`;
  }).join('');
}

// ── Export CSV ────────────────────────────────────
function exportCSV() {
  const name    = document.getElementById('d-name').textContent;
  const dateStr = document.getElementById('d-date').textContent;
  const hc      = headcount();

  const q = s => `"${String(s ?? '').replace(/"/g,'""')}"`;

  const rows = [
    [q('Event'), q(name)],
    [q('Date'),  q(dateStr)],
    [q('Exported'), q(new Date().toLocaleString())],
    [],
    [q('Name'), q('Status'), q('Time In'), q('+1'), q('Do Not Admit'), q('Notes')],
    ...guests.map(g => [
      q(g.name),
      q(g.status),
      q(g.ts || ''),
      q(g.plus1 ? 'Yes' : 'No'),
      q(g.dna   ? 'Yes' : 'No'),
      q(g.note)
    ]),
    [],
    [q('Not-on-list walk-ins'), q(nolCount)],
    [q('Total headcount'), q(hc)],
    [q('Admitted from list'), q(guests.filter(g=>g.status==='admitted').length)],
    [q('Denied'), q(guests.filter(g=>g.status==='denied').length)],
    [q('No-shows (pending)'), q(guests.filter(g=>g.status==='pending').length)],
  ];

  const csv  = rows.map(r => r.join(',')).join('\r\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url  = URL.createObjectURL(blob);
  const a    = document.createElement('a');
  a.href     = url;
  a.download = `doorlist-${name.toLowerCase().replace(/\s+/g,'-')}-${new Date().toISOString().split('T')[0]}.csv`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ── Init ──────────────────────────────────────────
document.getElementById('pw-in').focus();
</script>
