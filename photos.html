<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Upload Photos — The FreakHouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
:root {
  --bg: #080808; --surf: #141414; --surf2: #1e1e1e; --border: #2a2a2a;
  --gold: #D4A017; --gold-dim: #8a6808; --green: #22c55e;
  --text: #f0f0f0; --muted: #666;
  --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
}
body { background: var(--bg); color: var(--text); font-family: var(--font); min-height: 100vh; -webkit-font-smoothing: antialiased; }

.screen { display: none; min-height: 100vh; flex-direction: column; align-items: center; justify-content: center; padding: 2rem 1.5rem; text-align: center; }
.screen.active { display: flex; }

/* Loading */
.spinner { width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.loading-txt { font-size: .65rem; letter-spacing: .3em; text-transform: uppercase; color: var(--muted); margin-top: .75rem; }

/* Logo */
.logo { font-size: 2rem; font-weight: 900; letter-spacing: .06em; color: var(--gold); text-transform: uppercase; line-height: 1; margin-bottom: .4rem; }
.event-lbl { font-size: .7rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); margin-bottom: 2rem; }

/* No event */
.no-ev-icon { font-size: 2.5rem; margin-bottom: 1rem; }
.no-ev-title { font-size: 1.1rem; font-weight: 700; color: var(--muted); margin-bottom: .4rem; }
.no-ev-sub { font-size: .8rem; color: var(--muted); }

/* Upload screen */
#upload { justify-content: flex-start; padding-top: 2.5rem; max-width: 480px; width: 100%; margin: 0 auto; text-align: left; }

.fld { margin-bottom: 1rem; width: 100%; }
.fld label { display: block; font-size: .6rem; letter-spacing: .18em; text-transform: uppercase; color: var(--muted); font-weight: 600; margin-bottom: .4rem; }
.fld input { width: 100%; background: var(--surf); border: 1px solid var(--border); color: var(--text); font-family: var(--font); font-size: 1rem; padding: .8rem .9rem; outline: none; border-radius: 2px; transition: border-color .2s; }
.fld input:focus { border-color: var(--gold); }

.drop-zone {
  width: 100%; border: 2px dashed var(--border); border-radius: 8px;
  padding: 2.25rem 1rem; text-align: center; cursor: pointer;
  transition: border-color .2s, background .2s; margin-bottom: .875rem;
  touch-action: manipulation; background: var(--surf);
}
.drop-zone:active, .drop-zone.over { border-color: var(--gold); background: rgba(212,160,23,.05); }
.drop-icon { font-size: 2.25rem; margin-bottom: .5rem; }
.drop-main { font-size: 1rem; font-weight: 700; color: var(--gold); margin-bottom: .25rem; }
.drop-sub  { font-size: .8rem; color: var(--muted); }

.previews { display: grid; grid-template-columns: repeat(3,1fr); gap: .35rem; margin-bottom: .75rem; width: 100%; }
.prev-img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 4px; border: 1px solid var(--border); display: block; }

.sel-count { font-size: .8rem; color: var(--muted); margin-bottom: .75rem; text-align: center; }

.progress-wrap { width: 100%; height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; margin-bottom: .875rem; display: none; }
.progress-fill { height: 100%; background: var(--gold); border-radius: 2px; transition: width .3s; width: 0%; }

.btn {
  display: flex; align-items: center; justify-content: center; width: 100%;
  font-family: var(--font); font-weight: 700; font-size: .9rem; letter-spacing: .08em;
  text-transform: uppercase; padding: .95rem; border: none; cursor: pointer;
  border-radius: 2px; min-height: 54px; touch-action: manipulation; transition: opacity .15s;
}
.btn:active  { opacity: .8; }
.btn:disabled{ opacity: .3; pointer-events: none; }
.btn-gold  { background: var(--gold); color: #000; margin-bottom: .5rem; }
.btn-ghost { background: transparent; border: 1px solid var(--border); color: var(--muted); min-height: 44px; font-size: .75rem; }

/* Confirm */
#confirm { gap: 0; }
.confirm-icon  { font-size: 4rem; margin-bottom: 1rem; }
.confirm-title { font-size: 1.75rem; font-weight: 900; color: var(--green); margin-bottom: .5rem; }
.confirm-sub   { font-size: .85rem; color: var(--muted); margin-bottom: 2.5rem; line-height: 1.6; max-width: 280px; }
.confirm-btn   { max-width: 300px; width: 100%; }
</style>
</head>
<body>

<!-- LOADING -->
<div id="loading" class="screen active">
  <div class="spinner"></div>
  <p class="loading-txt">Loading…</p>
</div>

<!-- NO EVENT -->
<div id="no-event" class="screen">
  <div class="no-ev-icon">🎟</div>
  <p class="no-ev-title">No Event Tonight</p>
  <p class="no-ev-sub">Check back when an event is active.</p>
</div>

<!-- UPLOAD -->
<div id="upload" class="screen">
  <div style="width:100%;margin-bottom:1.5rem;text-align:center;">
    <div class="logo">The FreakHouse</div>
    <div class="event-lbl" id="event-lbl">Loading…</div>
  </div>

  <div class="fld">
    <label for="guest-name">Your Name</label>
    <input id="guest-name" type="text" placeholder="First + Last" autocomplete="name" autocorrect="off">
  </div>

  <input id="file-input" type="file" accept="image/*" multiple style="display:none" onchange="onFiles(this.files)">

  <div class="drop-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
    <div class="drop-icon">📷</div>
    <div class="drop-main">Tap to add photos</div>
    <div class="drop-sub">Choose from camera roll or take a photo</div>
  </div>

  <div class="previews" id="previews" style="display:none"></div>
  <p class="sel-count" id="sel-count"></p>

  <div class="progress-wrap" id="prog-wrap"><div class="progress-fill" id="prog-fill"></div></div>

  <button id="up-btn" class="btn btn-gold" onclick="doUpload()" disabled>Upload Photos</button>
  <button class="btn btn-ghost" onclick="clearFiles()">Clear</button>
</div>

<!-- CONFIRM -->
<div id="confirm" class="screen">
  <div class="confirm-icon">🎉</div>
  <div class="confirm-title">Submitted!</div>
  <p class="confirm-sub" id="confirm-sub">Your photos are in the queue and will appear in the gallery after review.</p>
  <button class="btn btn-gold confirm-btn" onclick="uploadMore()">Upload More Photos</button>
</div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-storage-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
let activeEvent  = null;
let selectedFiles = [];

// ── Init ──────────────────────────────────────────
async function init() {
  try {
    // Try isActive flag first
    let snap = await db.collection('events').where('isActive','==',true).limit(1).get();
    if (snap.empty) {
      // Fall back to today's date
      const today = new Date().toISOString().split('T')[0];
      snap = await db.collection('events').where('date','==',today).limit(1).get();
    }
    if (snap.empty) { show('no-event'); return; }
    activeEvent = { id: snap.docs[0].id, ...snap.docs[0].data() };
    document.getElementById('event-lbl').textContent =
      (activeEvent.name || 'Tonight') + (activeEvent.dateDisplay ? ' · ' + activeEvent.dateDisplay : '');
    show('upload');
  } catch(e) {
    console.error(e);
    show('no-event');
  }
}

// ── File selection ────────────────────────────────
function onFiles(files) {
  selectedFiles = [...files].filter(f => f.type.startsWith('image/'));
  if (!selectedFiles.length) return;

  const prev = document.getElementById('previews');
  prev.innerHTML = selectedFiles.map((_,i) => `<img class="prev-img" id="pi-${i}">`).join('');
  prev.style.display = 'grid';

  selectedFiles.forEach((f,i) => {
    const r = new FileReader();
    r.onload = e => { const el = document.getElementById(`pi-${i}`); if(el) el.src = e.target.result; };
    r.readAsDataURL(f);
  });

  const n = selectedFiles.length;
  document.getElementById('sel-count').textContent = `${n} photo${n>1?'s':''} selected`;
  document.getElementById('up-btn').textContent = `Upload ${n} Photo${n>1?'s':''}`;
  document.getElementById('up-btn').disabled = false;
}

function clearFiles() {
  selectedFiles = [];
  document.getElementById('file-input').value = '';
  document.getElementById('previews').innerHTML = '';
  document.getElementById('previews').style.display = 'none';
  document.getElementById('sel-count').textContent = '';
  document.getElementById('up-btn').textContent = 'Upload Photos';
  document.getElementById('up-btn').disabled = true;
  document.getElementById('prog-wrap').style.display = 'none';
  document.getElementById('prog-fill').style.width = '0%';
}

// ── Upload ────────────────────────────────────────
async function doUpload() {
  const name = document.getElementById('guest-name').value.trim() || 'Anonymous';
  const btn  = document.getElementById('up-btn');
  const wrap = document.getElementById('prog-wrap');
  const fill = document.getElementById('prog-fill');

  btn.disabled = true;
  btn.textContent = 'Uploading…';
  wrap.style.display = 'block';

  try {
    for (let i = 0; i < selectedFiles.length; i++) {
      const file    = selectedFiles[i];
      const photoRef = db.collection('events').doc(activeEvent.id).collection('photos').doc();
      const path     = `events/${activeEvent.id}/photos/${photoRef.id}`;
      const ref      = storage.ref(path);

      await ref.put(file, { contentType: file.type });
      const downloadUrl = await ref.getDownloadURL();

      await photoRef.set({
        guestName:   name,
        storagePath: path,
        downloadUrl,
        fileName:    file.name,
        fileSize:    file.size,
        status:      'pending',
        uploadedAt:  firebase.firestore.FieldValue.serverTimestamp()
      });

      fill.style.width = `${Math.round((i+1)/selectedFiles.length*100)}%`;
    }

    const n = selectedFiles.length;
    document.getElementById('confirm-sub').textContent =
      `${n} photo${n>1?'s':''} submitted for review. They'll appear in the gallery once approved.`;
    show('confirm');

  } catch(e) {
    console.error(e);
    alert('Upload failed — please check your connection and try again.');
    btn.disabled = false;
    btn.textContent = `Upload ${selectedFiles.length} Photo${selectedFiles.length>1?'s':''}`;
  }
}

function uploadMore() {
  clearFiles();
  show('upload');
}

function show(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

init();
</script>
</body>
</html>
